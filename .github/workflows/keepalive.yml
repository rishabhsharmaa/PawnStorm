# Keeps a free-tier game server from sleeping by pinging /health every 5 min.
# Setup: repo Settings → Secrets and variables → Actions → Secrets tab →
# New repository secret: KEEPALIVE_URL=https://your-game-server.onrender.com/health
# Only the game server needs pinging: it holds live sockets + clock timers.
# (The Next.js frontend on Vercel is serverless and never sleeps.)
#
# Secrets are mapped to job-level env (not read in `if` directly) because the
# secrets context is not allowed in job-level `if`, and a step's `if` cannot
# see that same step's `env`. Unset URLs skip their step, so the run stays
# green before deploy. Note: GitHub cron often runs late — use UptimeRobot or
# cron-job.org on the same URL as the primary pinger (they also alert on
# downtime) and keep this workflow as a backup.
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
      KEEPALIVE_WEB_URL: ${{ secrets.KEEPALIVE_WEB_URL }}
    steps:
      - name: Ping game server /health
        if: ${{ env.KEEPALIVE_URL != '' }}
        run: curl -fsS --max-time 60 "$KEEPALIVE_URL" > /dev/null
      - name: Ping web leaderboard (keeps free Postgres active)
        if: ${{ env.KEEPALIVE_WEB_URL != '' }}
        run: curl -fsS --max-time 60 "$KEEPALIVE_WEB_URL/leaderboard" > /dev/null
