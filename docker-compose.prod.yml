# Production stack: Postgres + Redis + game server + web + Caddy (auto TLS).
# Deploy: cp .env.prod.example .env && $EDITOR .env && docker compose -f docker-compose.prod.yml up -d --build
name: pawnstorm-prod
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawnstorm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pawnstorm
    volumes:
      - pawnstorm-prod-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawnstorm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pawnstorm-prod-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pawnstorm:${POSTGRES_PASSWORD}@postgres:5432/pawnstorm
      REDIS_URL: redis://redis:6379
      GAME_SERVER_JWT_SECRET: ${GAME_SERVER_JWT_SECRET:?set GAME_SERVER_JWT_SECRET in .env}
      WEB_ORIGIN: https://${APP_HOST:?set APP_HOST in .env}
      GAME_SERVER_PORT: 4000
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GAME_SERVER_URL: https://${APP_HOST}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pawnstorm:${POSTGRES_PASSWORD}@postgres:5432/pawnstorm
      NEXTAUTH_URL: https://${APP_HOST}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      GAME_SERVER_JWT_SECRET: ${GAME_SERVER_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      game-server:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - pawnstorm-prod-caddy:/data
    environment:
      APP_HOST: ${APP_HOST}
    depends_on:
      web:
        condition: service_started
      game-server:
        condition: service_started

volumes:
  pawnstorm-prod-pg:
  pawnstorm-prod-redis:
  pawnstorm-prod-caddy:
